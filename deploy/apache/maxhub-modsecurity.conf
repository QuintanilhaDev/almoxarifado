# =====================================================================
#  Max Hub · ajustes do WAF (ModSecurity v2 + OWASP CRS 3.x/4.x)
#  Copiar para /etc/apache2/maxhub-modsecurity.conf (incluído pelo maxhub.conf).
#
#  Começa BLOQUEANDO (On). Se uma ação legítima for barrada, o motivo aparece em
#  /var/log/apache2/modsec_audit.log (procure o "id" da regra) e a exceção entra aqui embaixo.
#  Para observar sem bloquear por uns dias: troque On por DetectionOnly.
# =====================================================================
SecRuleEngine On
SecRequestBodyAccess On
# JSON e formulários: até 20 MB (importação de planilhas vai como JSON); arquivos: até 55 MB
SecRequestBodyLimit 57671680
SecRequestBodyNoFilesLimit 20971520
SecRequestBodyLimitAction Reject
SecResponseBodyAccess Off
SecAuditEngine RelevantOnly
SecAuditLog /var/log/apache2/modsec_audit.log

# nível de rigor e métodos aceitos: em /etc/modsecurity/maxhub-crs-setup.conf (precisa carregar antes do CRS)

# ---------- exceções do Max Hub ----------

# tempo real (/api/tempo-real): conexão longa só de leitura; nada de inspecionar a resposta
SecRule REQUEST_URI "@beginsWith /api/tempo-real" "id:10101,phase:1,pass,nolog,ctl:responseBodyAccess=Off"

# arquivos (/api/arquivos): só funciona com link assinado pelo sistema; o corpo é a foto/vídeo/PDF
# em si (binário), que o CRS confundiria com ataque
SecRule REQUEST_URI "@beginsWith /api/arquivos" "id:10102,phase:1,pass,nolog,ctl:requestBodyAccess=Off"

# textos livres digitados pelas pessoas (conversa com a Max, chamados, observações):
# frases como "selecione o item from posto…" disparam a regra de SQL injection por engano.
# O sistema não monta SQL com texto do usuário (todas as consultas são parametrizadas)
# e o React escapa tudo que mostra na tela, então aqui só tiramos esses dois grupos.
SecRule REQUEST_URI "@rx ^/api/(max/|chamados)" "id:10103,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-sqli,ctl:ruleRemoveByTag=attack-xss"
