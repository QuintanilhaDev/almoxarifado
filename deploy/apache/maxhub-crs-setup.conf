# =====================================================================
#  Max Hub · configuração do OWASP CRS (carrega ANTES das regras do CRS)
#  Copiar para /etc/modsecurity/maxhub-crs-setup.conf
#  (o Apache do Ubuntu inclui /etc/modsecurity/*.conf antes do CRS)
# =====================================================================

# nível de rigor 1 (padrão do CRS, poucos falsos positivos)
SecAction "id:10001,phase:1,pass,nolog,t:none,setvar:tx.paranoia_level=1,setvar:tx.executing_paranoia_level=1"

# o Max Hub usa PUT, PATCH e DELETE além de GET/POST (o padrão do CRS só aceita GET HEAD POST OPTIONS)
SecAction "id:10002,phase:1,pass,nolog,t:none,setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"
