# =====================================================================
#  Max Hub · Apache (proxy reverso + WAF) — modelo integrado
#
#  Usuário → Apache :443 (HTTPS + ModSecurity/OWASP CRS) → Max Hub 127.0.0.1:880 → Postgres 127.0.0.1:5432
#
#  Copiar para /etc/apache2/sites-available/maxhub.conf e trocar o domínio, se for outro.
#  Módulos: sudo a2enmod ssl proxy proxy_http headers rewrite http2 security2
#  Ativar:  sudo a2ensite maxhub && sudo apachectl configtest && sudo systemctl reload apache2
# =====================================================================

# HTTP → HTTPS
<VirtualHost *:80>
    ServerName estoque.grupomaxforte.com.br
    RewriteEngine On
    # o certbot precisa responder aqui para renovar o certificado
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName estoque.grupomaxforte.com.br
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/estoque.grupomaxforte.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/estoque.grupomaxforte.com.br/privkey.pem
    # (se o certificado for da empresa, troque os dois caminhos acima)
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # ---------- WAF (ModSecurity + OWASP CRS) ----------
    # regras gerais em /etc/modsecurity/ e /usr/share/modsecurity-crs/ (pacote modsecurity-crs);
    # os ajustes do Max Hub ficam no arquivo abaixo
    <IfModule security2_module>
        Include /etc/apache2/maxhub-modsecurity.conf
    </IfModule>

    # ---------- cabeçalhos de segurança ----------
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)"
    ServerSignature Off

    # ---------- tamanho dos envios ----------
    # fotos/vídeos do formulário dos supervisores vão até 50 MB
    LimitRequestBody 57671680

    # ---------- encaminhamento para o Max Hub ----------
    ProxyRequests Off
    ProxyPreserveHost On
    # o IP do usuário é o que o Apache viu (o que o navegador mandar nesse cabeçalho é descartado);
    # o sistema usa esse IP nos limites de tentativas e na auditoria
    RequestHeader unset X-Forwarded-For early
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 120

    # tempo real (Server-Sent Events): conexão longa, sem buffer e sem compressão
    <Location /api/tempo-real>
        SetEnv no-gzip 1
        SetEnv proxy-sendchunked 1
        SetEnv proxy-initial-not-pooled 1
    </Location>
    ProxyPass        /api/tempo-real http://127.0.0.1:880/api/tempo-real flushpackets=on timeout=3600 keepalive=On
    ProxyPassReverse /api/tempo-real http://127.0.0.1:880/api/tempo-real

    ProxyPass        / http://127.0.0.1:880/ keepalive=On
    ProxyPassReverse / http://127.0.0.1:880/

    ErrorLog  ${APACHE_LOG_DIR}/maxhub-erro.log
    CustomLog ${APACHE_LOG_DIR}/maxhub-acesso.log combined
</VirtualHost>
